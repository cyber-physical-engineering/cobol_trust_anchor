name: Build & Test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t cobol-trust-anchor .

      - name: Run the demo
        run: |
          mkdir -p out
          docker run --rm -v "$PWD/out:/app/out" -w /app/out cobol-trust-anchor /app/trust-anchor | tee output.txt
          grep -q "TRUST ANCHOR CREATED" output.txt
          grep -q "HASH:" output.txt

      - name: Verify the log
        run: python3 verify.py out/anchor_log.txt

      - name: Confirm a changed record is caught
        run: |
          sed 's/WIRE/FIRE/' out/anchor_log.txt > out/tampered.txt
          if python3 verify.py out/tampered.txt; then
            echo "verify.py accepted a changed record"
            exit 1
          fi

      - name: Upload demo output
        uses: actions/upload-artifact@v7
        with:
          name: demo-output
          path: |
            output.txt
            out/anchor_log.txt
